auto-download-path: true # 현재 디렉토리 위치에서 생성된 downloads 폴더에 자막 저장 (기본값: true)
auto-dpi: true # 수동으로 dpi 사용시 false로 설정 
dpi: 120 # auto-dpi = false 일때 작동, 기본값: 120 DPI (125% 배율)  / 해상도에 따라 96 DPI(100%), 120 DPI(125%), 144 DPI(150%), 192 DPI(200%)를 설정하세요

# AI 자막 번역. active 만 바꾸면 제공자가 바뀝니다. 기본값 none 은 번역을 사용하지 않습니다.
# API 키는 사용할 제공자의 api_key 에 적습니다.
ai-translate:
  active: none # openai 또는 gemini
  providers:
    openai:
      api_key: ""
      model: gpt-4.1-mini
    gemini:
      api_key: ""
      model: gemini-3.8-flash